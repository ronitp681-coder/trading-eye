name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: flutter pub get
        working-directory: trading-eye
      - run: flutter build apk --release
        working-directory: trading-eye
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: trading-eye/build/app/outputs/flutter-apk/app-release.apk
